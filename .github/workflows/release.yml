name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          grep -q "static let version = \"$version\"" Sources/BlueprintCore/Model/Snapshot.swift \
            || { echo "::error::MacBlueprint.version is not $version"; exit 1; }
          grep -q "MARKETING_VERSION = $version;" App/MacBlueprint.xcodeproj/project.pbxproj \
            || { echo "::error::The app's MARKETING_VERSION is not $version"; exit 1; }

      - name: Test
        run: swift test

      - name: Build the command-line tool
        run: |
          swift build -c release --arch arm64 --arch x86_64
          mkdir -p dist
          cp .build/apple/Products/Release/macblueprint dist/
          (cd dist && zip -q "macblueprint-$VERSION-macos.zip" macblueprint && rm macblueprint)

      - name: Build the app
        run: |
          xcodebuild -project App/MacBlueprint.xcodeproj -scheme MacBlueprint \
            -configuration Release -derivedDataPath build/app \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build
          ditto -c -k --keepParent build/app/Build/Products/Release/MacBlueprint.app "dist/MacBlueprint-$VERSION.zip"

      - name: Checksums
        run: cd dist && shasum -a 256 *.zip | tee checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **MacBlueprint.app** and the **macblueprint** command-line tool, both universal (Apple silicon and Intel), macOS 14 or later.

          The app isn't notarized yet. The first time you open it, macOS will say it can't check it for malicious software: open **System Settings → Privacy & Security** and click **Open Anyway**.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MacBlueprint $VERSION" \
            --notes-file notes.md \
            --generate-notes

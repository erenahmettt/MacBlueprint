name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Smoke test on the runner
        run: |
          swift run macblueprint scan --label "CI runner" --markdown -o ci-snapshot.json
          swift run macblueprint export ci-snapshot.json > /dev/null
